# Lesbord — werkt het overzicht en de PDF's automatisch bij
# als er een les wordt opgeslagen, aangepast of verwijderd (ook vanuit de app).
name: Lessen bijwerken

on:
  push:
    branches: [main]
    paths:
      - "lessen/**/les.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lessen-bijwerken
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installeren
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Welke lessen zijn veranderd?
        id: wijzig
        run: |
          VOOR="${{ github.event.before }}"
          if [ -z "$VOOR" ] || [ "$VOOR" = "0000000000000000000000000000000000000000" ]; then VOOR="HEAD~1"; fi
          IDS=$(git diff --name-only "$VOOR" HEAD -- 'lessen/*/les.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Veranderd: $IDS"

      - name: Overzicht en PDF's maken
        run: |
          if [ -n "${{ steps.wijzig.outputs.ids }}" ]; then
            python tools/publiceer.py ${{ steps.wijzig.outputs.ids }}
          else
            python tools/publiceer.py --catalogus
          fi

      - name: Opslaan
        run: |
          git config user.name "Lesbord"
          git config user.email "lesbord@users.noreply.github.com"
          git add -A lessen
          if git diff --cached --quiet; then echo "Niets veranderd"; exit 0; fi
          git commit -m "Overzicht en PDF's bijgewerkt"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
