<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meedoen · Lesbord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rye&family=Caveat+Brush&display=swap" rel="stylesheet">
  <style>
    :root { --hout: #2b1a0e; --hout2: #4a2e17; --krijt: #f4efe2; --koper: #e0a84a; --bord: #27312b; --papier: #efe0bf; --ink: #3a2412; --groen: #8fe3a8; --rood: #ff8a7a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 20px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif; color: var(--krijt);
      background: repeating-linear-gradient(90deg, #3a2412 0 120px, #33200f 120px 240px); background-attachment: fixed;
    }
    main { max-width: 560px; margin: 0 auto; padding: 18px 16px 120px; }
    h1 { font: 400 30px/1.15 "Rye", Georgia, serif; color: var(--koper); margin: 6px 0 4px; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
    .sub { color: #d8c9a8; margin: 0 0 16px; }
    .bord { background: var(--bord); border: 10px solid #a8733a; border-radius: 12px; box-shadow: 0 0 0 3px #3b2312, 0 10px 24px rgba(0,0,0,.5), inset 0 0 50px rgba(0,0,0,.55); padding: 20px 18px; }
    label.veld { display: block; font-weight: 700; margin-bottom: 6px; }
    input[type=text], textarea {
      width: 100%; font: inherit; font-size: 22px; padding: 14px; border-radius: 12px; border: 3px solid #cbb98f;
      background: #fff9e8; color: var(--ink);
    }
    textarea { min-height: 150px; resize: vertical; }
    input:focus, textarea:focus { outline: 0; border-color: var(--koper); }
    button.knop {
      width: 100%; font: inherit; font-size: 22px; font-weight: 700; padding: 16px; margin-top: 14px; border: 0; border-radius: 14px;
      background: var(--koper); color: #2a170a; cursor: pointer; box-shadow: 0 4px 0 #8a5a1c;
    }
    button.knop:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a5a1c; }
    button.knop:disabled { opacity: .5; }
    .melding { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.07); }
    .melding.fout { color: var(--rood); }
    .ok { color: var(--groen); font-weight: 700; }
    .team { display: inline-block; padding: 4px 16px; border-radius: 999px; background: var(--papier); color: var(--ink); font-weight: 700; margin-bottom: 14px; }
    .vraag { font-size: 24px; font-weight: 700; margin: 0 0 14px; }
    .keuzes { display: grid; gap: 12px; }
    .keuze {
      display: flex; gap: 14px; align-items: flex-start; text-align: left; font: inherit; font-size: 20px; padding: 14px; border-radius: 14px;
      border: 3px solid rgba(244,239,226,.5); background: rgba(255,255,255,.05); color: var(--krijt); width: 100%; cursor: pointer;
    }
    .keuze b { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--papier); color: var(--ink); display: grid; place-items: center; font: 400 24px "Rye", Georgia, serif; }
    .keuze[aria-pressed=true] { border-color: var(--groen); background: rgba(60,120,80,.35); }
    .keuze:disabled { opacity: .35; }
    details { margin: 10px 0; border: 2px solid rgba(244,239,226,.35); border-radius: 12px; padding: 4px 12px; }
    summary { font-weight: 700; padding: 10px 0; cursor: pointer; color: var(--koper); }
    .vink { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(244,239,226,.12); }
    .vink input { width: 28px; height: 28px; accent-color: #8fe3a8; flex: none; }
    .vast { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; background: linear-gradient(transparent, rgba(30,18,8,.95) 30%); }
    .vast .knop { max-width: 528px; margin: 0 auto; display: block; }
    .klein { font-size: 15px; color: #c9bb98; }
  </style>
</head>
<body>
  <main>
    <h1>De grote kroegquiz</h1>
    <p class="sub" id="sub">Even laden…</p>
    <div class="bord" id="inhoud"></div>
  </main>
  <script src="assets/live-config.js"></script>
  <script src="assets/live.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const code = (new URLSearchParams(location.search).get("k") || "").toUpperCase();
    const inhoud = $("inhoud"), sub = $("sub");
    const maak = (tag, tekst, klasse) => { const e = document.createElement(tag); if (tekst) e.textContent = tekst; if (klasse) e.className = klasse; return e; };
    const leeg = () => { inhoud.replaceChildren(); };
    const toon = (...kinderen) => { inhoud.replaceChildren(...kinderen); };

    // Wie ben ik? (bewaard op deze telefoon, zodat herladen geen nieuw team maakt)
    const sleutel = `lesbord-live-team-${code}`;
    let ik = null;
    try { ik = JSON.parse(localStorage.getItem(sleutel) || "null"); } catch (e) { /* geen opslag */ }
    const bewaarIk = () => { try { localStorage.setItem(sleutel, JSON.stringify(ik)); } catch (e) { /* geen opslag */ } };
    const nieuwId = () => { const b = new Uint8Array(6); crypto.getRandomValues(b); return "t" + [...b].map((x) => (x % 36).toString(36)).join(""); };

    let kamer = null, getoondId = null, getoondOpen = null, verstuurd = {}, meta = null;

    function fout(tekst) { sub.textContent = ""; toon(maak("p", tekst, "melding fout")); }

    // ---------- Meedoen ----------
    function meedoenScherm(melding) {
      sub.textContent = "Kies een naam voor jullie team.";
      const veld = maak("input"); veld.type = "text"; veld.maxLength = 24; veld.placeholder = "Teamnaam"; veld.autocomplete = "off";
      veld.setAttribute("aria-label", "Teamnaam");
      const knop = maak("button", "Meedoen", "knop");
      const m = maak("p", melding || "", melding ? "melding fout" : "");
      knop.onclick = async () => {
        const naam = veld.value.trim();
        if (!naam) { m.textContent = "Typ eerst een teamnaam."; m.className = "melding fout"; return; }
        knop.disabled = true;
        try {
          const teams = (await Live.lees(code, "teams")) || {};
          const ids = Object.keys(teams);
          const id = ik && ik.tid ? ik.tid : nieuwId();
          if (!ids.includes(id) && ids.length >= (meta.maxTeams || 3)) {
            knop.disabled = false; m.textContent = "Er doen al genoeg teams mee. Vraag het aan de quizmaster."; m.className = "melding fout"; return;
          }
          await Live.schrijf(code, `teams/${id}`, { naam, ts: Date.now() });
          ik = { tid: id, naam }; bewaarIk();
          luisterNaarKamer();
        } catch (e) { knop.disabled = false; m.textContent = "Dat lukte niet. Probeer het nog een keer."; m.className = "melding fout"; }
      };
      veld.addEventListener("keydown", (e) => { if (e.key === "Enter") knop.click(); });
      toon(maak("label", "Teamnaam", "veld"), veld, knop, m);
      veld.focus();
    }

    // ---------- Wachten en vragen ----------
    function teken() {
      if (!kamer || !kamer.teams || !kamer.teams[ik.tid]) { ik = null; try { localStorage.removeItem(sleutel); } catch (e) {} return meedoenScherm(); }
      const v = kamer.vraag;
      const naam = kamer.teams[ik.tid].naam;
      sub.textContent = "";
      if (!v) { getoondId = null; return toon(maak("div", naam, "team"), maak("p", "Je doet mee! Wacht op de volgende vraag.")); }
      const open = v.open !== false;
      if (getoondId === v.id && getoondOpen === open) return; // niets veranderd: laat getypte tekst met rust
      getoondId = v.id; getoondOpen = open;
      const eerder = kamer.antw && kamer.antw[v.id] && kamer.antw[v.id][ik.tid];
      const kop = [maak("div", naam, "team"), maak("p", v.tekst || "", "vraag")];
      if (!open) kop.push(maak("p", "Deze vraag is gesloten.", "melding"));
      const status = maak("p", eerder ? "Verstuurd ✓ Je mag het nog aanpassen." : "", "melding ok");
      if (!eerder) status.style.display = "none";
      const stuur = async (w, knopEl) => {
        if (knopEl) knopEl.disabled = true;
        try {
          await Live.schrijf(code, `antw/${v.id}/${ik.tid}`, { w, t: Date.now() });
          status.textContent = "Verstuurd ✓ Je mag het nog aanpassen."; status.style.display = ""; status.className = "melding ok";
        } catch (e) { status.textContent = "Versturen lukte niet. Probeer het nog een keer."; status.style.display = ""; status.className = "melding fout"; }
        if (knopEl) knopEl.disabled = false;
      };

      if (v.soort === "keuze") {
        const lijst = (v.opties && v.opties.length ? v.opties : ["", "", "", ""]);
        const uit = v.uitsluit && v.uitsluit[ik.tid];
        let gekozen = eerder ? eerder.w : null;
        const wrap = maak("div", null, "keuzes");
        lijst.forEach((tekst, i) => {
          const letter = String.fromCharCode(65 + i);
          const b = maak("button", null, "keuze"); b.type = "button";
          b.append(maak("b", letter), maak("span", tekst || `Optie ${letter}`));
          b.setAttribute("aria-pressed", String(gekozen === letter));
          b.disabled = !open || uit === letter;
          b.onclick = () => { gekozen = letter; wrap.querySelectorAll(".keuze").forEach((x, j) => x.setAttribute("aria-pressed", String(j === i))); stuur(letter); };
          wrap.append(b);
        });
        if (uit) kop.push(maak("p", `Optie ${uit} is van jullie zelf, die kun je niet kiezen.`, "klein"));
        return toon(...kop, wrap, status);
      }
      if (v.soort === "vinkjes") {
        const groepen = v.groepen || [{ naam: "", items: v.opties || [] }];
        const gekozen = new Set(eerder && eerder.w ? String(eerder.w).split(",").filter(Boolean).map(Number) : []);
        let start = 0;
        const delen = groepen.map((g) => {
          const d = maak("details"); d.open = groepen.length <= 1;
          d.append(maak("summary", g.naam || "Smaken"));
          (g.items || []).forEach((tekst) => {
            const i = start++;
            const l = maak("label", null, "vink"); const c = maak("input"); c.type = "checkbox"; c.checked = gekozen.has(i); c.disabled = !open;
            c.onchange = () => { c.checked ? gekozen.add(i) : gekozen.delete(i); teller.textContent = `${gekozen.size} gekozen`; };
            l.append(c, maak("span", tekst)); d.append(l);
          });
          return d;
        });
        const teller = maak("p", `${gekozen.size} gekozen`, "klein");
        const knop = maak("button", "Versturen", "knop"); knop.disabled = !open;
        knop.onclick = () => stuur([...gekozen].sort((a, b) => a - b).join(","), knop);
        const vast = maak("div", null, "vast"); vast.append(knop);
        return toon(...kop, teller, ...delen, status, vast);
      }
      // tekst
      const veld = maak("textarea"); veld.maxLength = 400; veld.disabled = !open; veld.value = eerder ? String(eerder.w) : "";
      veld.setAttribute("aria-label", "Jullie antwoord");
      const knop = maak("button", "Versturen", "knop"); knop.disabled = !open;
      knop.onclick = () => { const w = veld.value.trim(); if (w) stuur(w, knop); };
      return toon(...kop, veld, knop, status);
    }

    function luisterNaarKamer() {
      sub.textContent = "Verbinden…";
      Live.luister(code, "", (w) => { kamer = w; if (ik) teken(); }, (s) => { if (s === "fout") $("sub").textContent = "Geen verbinding. We proberen het opnieuw…"; });
    }

    // ---------- Start ----------
    (async () => {
      if (!Live.geldigeCode(code)) return fout("Deze link klopt niet. Scan de QR-code op het scherm opnieuw.");
      if (!Live.beschikbaar()) return fout("Meedoen is nog niet ingesteld.");
      try { meta = await Live.lees(code, "meta"); } catch (e) { return fout("Geen verbinding. Probeer het nog een keer."); }
      if (!meta) return fout("Deze kamer bestaat niet (meer). Vraag de quizmaster om een nieuwe code.");
      if (ik && ik.tid) { // al eerder meegedaan: meteen verder
        try { const t = await Live.lees(code, `teams/${ik.tid}`); if (t) return luisterNaarKamer(); } catch (e) { return luisterNaarKamer(); }
        ik = null;
      }
      meedoenScherm();
    })();
  </script>
</body>
</html>
