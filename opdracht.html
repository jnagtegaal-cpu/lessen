<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opdracht · Lesbord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    :root {
      --achter: #f6faf7; --vlak: #ffffff; --rand: #dfe9e2; --tekst: #1d2b24; --zacht: #52635a;
      --accent: #2f9e63; --accent-schaduw: #1f7a4a; --kop: #1f7a4a; --label: #e3f4ea; --fout: #c0392b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font: 20px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; color: var(--tekst); background: var(--achter); }
    main { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
    h1 { font-size: 30px; line-height: 1.15; color: var(--kop); margin: 6px 0 4px; }
    h2 { font-size: 22px; margin: 18px 0 10px; }
    h2:first-child { margin-top: 0; }
    .sub { color: var(--zacht); margin: 0 0 14px; min-height: 1.4em; }
    .vlak { background: var(--vlak); border: 1px solid var(--rand); border-radius: 16px; padding: 22px 20px; box-shadow: 0 6px 20px rgba(20,50,35,.08); }
    .knop {
      font: inherit; font-size: 22px; font-weight: 700; padding: 14px 22px; border: 0; border-radius: 14px;
      background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 4px 0 var(--accent-schaduw);
    }
    .knop:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-schaduw); }
    .knop:disabled { opacity: .45; cursor: default; }
    .knop.licht { background: #fff; color: var(--kop); border: 3px solid var(--rand); box-shadow: none; }
    .knop.breed { width: 100%; margin-top: 16px; }
    .rij { display: flex; gap: 12px; justify-content: space-between; margin-top: 22px; }
    .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
    .letter {
      font: 700 26px/1 "Atkinson Hyperlegible", sans-serif; padding: 18px 0; border-radius: 14px; border: 3px solid var(--rand);
      background: var(--label); color: var(--kop); cursor: pointer;
    }
    .letter:hover { border-color: var(--accent); }
    .letter:disabled { background: #eef1ef; color: #a3b0a8; border-color: #eef1ef; cursor: default; text-decoration: line-through; }
    .wie { display: inline-block; padding: 4px 16px; border-radius: 999px; background: var(--label); color: var(--kop); font-weight: 700; }
    .kopregel { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .teller { color: var(--zacht); }
    .ww { display: inline-block; font-weight: 700; color: var(--kop); background: var(--label); border-radius: 999px; padding: 4px 20px; font-size: 22px; margin-bottom: 18px; }
    .zin { font-size: 30px; line-height: 1.9; }
    .zin input {
      font: inherit; font-weight: 700; width: 8.5em; max-width: 100%; text-align: center; padding: 0 6px; margin: 0 4px;
      border: 0; border-bottom: 4px solid var(--tekst); background: #f3f8f5; border-radius: 6px 6px 0 0; color: var(--tekst);
    }
    .zin input:focus { outline: 0; border-bottom-color: var(--accent); background: #e9f6ee; }
    .bolletjes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
    .bol { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--rand); background: #fff; font: 700 16px sans-serif; color: var(--zacht); cursor: pointer; }
    .bol.ingevuld { background: var(--label); border-color: var(--accent); color: var(--kop); }
    .bol.hier { outline: 3px solid var(--accent); outline-offset: 2px; }
    .overzicht { list-style: none; margin: 0; padding: 0; }
    .overzicht li { display: flex; gap: 12px; align-items: baseline; padding: 10px 4px; border-top: 1px solid var(--rand); cursor: pointer; }
    .overzicht li:first-child { border-top: 0; }
    .overzicht .nr { flex: none; width: 34px; color: var(--zacht); }
    .overzicht .leeg { color: var(--fout); font-weight: 700; }
    .melding { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(127,127,127,.1); }
    .melding.fout { color: var(--fout); }
    .midden { text-align: center; }
    .groot { font-size: 44px; font-weight: 700; color: var(--kop); margin: 4px 0; }
    .link { background: none; border: 0; color: var(--zacht); font: inherit; font-size: 17px; text-decoration: underline; cursor: pointer; padding: 0; }
    .opslag { font-size: 15px; color: var(--zacht); text-align: right; min-height: 1.2em; margin-top: 10px; }
    @media (max-width: 520px) { .zin { font-size: 24px; } .knop { font-size: 19px; padding: 12px 16px; } }
    .opdrachten { display: grid; gap: 12px; }
    .opdracht { display: flex; justify-content: space-between; align-items: center; gap: 14px; text-align: left; width: 100%; font: inherit; font-size: 24px; padding: 18px 20px; border-radius: 14px; border: 3px solid var(--rand); background: #fff; color: var(--tekst); cursor: pointer; }
    .opdracht:hover { border-color: var(--accent); }
    .opdracht.uit { background: #f3f5f4; color: #a3b0a8; border-color: #eef1ef; cursor: default; }
    #naarVakken.link { display: inline-block; margin-bottom: 14px; }
    .opdracht .pijl { flex: none; font-weight: 700; color: var(--kop); }
    .opdracht.gedaan { background: #eef1ef; }
    .opdracht.gedaan .pijl { color: var(--zacht); }
    #naarLijst.link { display: inline-block; margin-bottom: 14px; }
    /* Woorden oefenen */
    .plaatje { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-size: 96px; line-height: 1.1; text-align: center; margin: 4px 0 10px; }
    .woord { text-align: center; font-size: 44px; font-weight: 700; color: var(--kop); min-height: 1.3em; letter-spacing: .02em; }
    .woord.weg { visibility: hidden; }
    .hint { text-align: center; font-size: 44px; font-weight: 700; color: var(--kop); min-height: 1.3em; letter-spacing: .1em; }
    .hint .rest { color: #b5c0ba; }
    .typ { display: block; width: 100%; font: inherit; font-size: 34px; font-weight: 700; text-align: center; padding: 10px; margin-top: 12px;
      border: 3px solid var(--rand); border-radius: 14px; background: #f3f8f5; color: var(--tekst); }
    .typ:focus { outline: 0; border-color: var(--accent); background: #e9f6ee; }
    .typ.fout { border-color: var(--fout); background: #fdecea; animation: schud .3s; }
    .typ.goed { border-color: var(--accent); background: #dff3e7; }
    @keyframes schud { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .voortgang { height: 12px; border-radius: 999px; background: #e7efe9; overflow: hidden; margin: 14px 0 0; }
    .voortgang div { height: 100%; background: var(--accent); transition: width .3s; }
    .ronde { display: inline-block; padding: 4px 14px; border-radius: 999px; background: #fff4d6; color: #7a5a00; font-weight: 700; font-size: 17px; }
    .terugmelding { text-align: center; min-height: 1.5em; margin-top: 10px; font-weight: 700; }
    .terugmelding.fout { color: var(--fout); }
    .terugmelding.goed { color: var(--kop); }
  </style>
</head>
<body>
  <main>
    <h1 id="titel">Opdrachten</h1>
    <p class="sub" id="sub">Even laden…</p>
    <div class="vlak" id="inhoud"></div>
  </main>
  <script src="assets/live-config.js?v=4845a280"></script>
  <script src="assets/live.js?v=d20cbb44"></script>
  <script>
  // Lesbord — leerlingopdrachten maken. Vaste link voor de leerlingen. Zie LESFORMAAT.md ("Leerlingopdrachten").
  (() => {
    const PLEK = "KLASTOETS";                 // vaste plek in de database: welke opdrachten klaarstaan
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const opslag = {
      lees(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
      zet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };
    const apparaat = opslag.lees("toets-apparaat") || (() => { const a = Math.random().toString(36).slice(2, 10); opslag.zet("toets-apparaat", a); return a; })();
    const mijnLetters = () => opslag.lees("opdracht-letters") || {};      // per ronde: welke letter op dit apparaat
    const zetMijnLetter = (k, l) => { const m = mijnLetters(); if (l) m[k] = l; else delete m[k]; opslag.zet("opdracht-letters", m); };

    let rondes = {}, overzicht = [], klas = null;
    let huidig = null, toets = null, kamer = null, leerlingen = {}, stopKamer = null;
    let ik = null, antwoorden = [], nu = 0, fase = "lijst", schrijfTimer = null;
    let stap = 0, fouten = {}, woordenLijst = [];   // bij soort "woorden": waar het kind is en wat het fout typte
    const ontcijfer = (a) => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(a), (c) => c.charCodeAt(0)).reverse()));
    const isWoorden = () => toets && toets.soort === "woorden";

    const meld = (tekst, fout) => `<p class="melding${fout ? " fout" : ""}">${esc(tekst)}</p>`;
    const titelVan = (id) => (overzicht.find((t) => t.id === id) || {}).titel || "Opdracht";
    const vakVan = (id) => (overzicht.find((t) => t.id === id) || {}).vak || "Overig";
    let vakLijst = [], gekozenVak = null;
    async function laadJson(pad) { const r = await fetch(pad, { cache: "no-store" }); if (!r.ok) throw new Error(pad); return r.json(); }
    const terugKnop = `<button class="link" id="naarLijst">← Terug</button>`;
    function koppelTerug() { const b = $("naarLijst"); if (b) b.onclick = naarLijst; }

    // Een opdracht kan klaarstaan voor bepaalde leerlingen (letters in "voor"). Leeg = iedereen.
    const voorWie = (r) => (r && Array.isArray(r.voor) && r.voor.length) ? r.voor : null;
    const magIk = (r, l) => !voorWie(r) || voorWie(r).includes(l);
    // De letter die op dit apparaat het laatst gekozen is (om alleen de eigen opdrachten te tonen).
    const bekendeLetter = () => opslag.lees("opdracht-laatste-letter");
    // Welke opdrachten ziet dit apparaat? Is de letter bekend, dan alleen die voor iedereen of voor deze letter.
    function zichtbareRondes() {
      const l = bekendeLetter();
      return Object.entries(rondes).filter(([, r]) => !l || magIk(r, l));
    }

    function naarLijst() {
      if (stopKamer) { stopKamer(); stopKamer = null; }
      huidig = null; toets = null; kamer = null; leerlingen = {}; ik = null; fase = "lijst";
      teken();
    }

    function teken() {
      const el = $("inhoud");
      if (!Live.beschikbaar()) { el.innerHTML = meld("Deze functie staat uit.", true); return; }
      if (!huidig) return tekenLijst(el);
      if (!toets || !kamer) { el.innerHTML = `<p>Even laden…</p>`; return; }
      $("titel").textContent = toets.titel;
      if (fase === "ingeleverd") {
        $("sub").textContent = "";
        el.innerHTML = `<div class="midden"><p class="groot">Ingeleverd!</p><p>Goed gedaan, <b>${esc(ik)}</b>. Je bent klaar met deze opdracht.</p>
          <button class="knop breed" id="naarLijst">Terug naar de opdrachten</button></div>`;
        return koppelTerug();
      }
      if (!rondes[huidig] || (kamer.info && kamer.info.gesloten)) {
        $("sub").textContent = "";
        el.innerHTML = `<div class="midden"><p class="groot">Deze opdracht is afgesloten</p><p>Je kunt niets meer veranderen. Wat je had ingevuld, is bewaard.</p>
          <button class="knop breed" id="naarLijst">Terug naar de opdrachten</button></div>`;
        return koppelTerug();
      }
      if (!ik) return tekenLetters(el);
      if (fase === "bevestig") return tekenBevestig(el);
      if (fase === "overzicht") return tekenOverzicht(el);
      if (fase === "woord") return tekenWoord(el);
      if (fase === "tussen") return tekenTussen(el);
      tekenVraag(el);
    }

    function tekenLijst(el) {
      $("titel").textContent = "Opdrachten";
      const lijst = zichtbareRondes().sort((a, b) => (a[1].gestart || 0) - (b[1].gestart || 0));
      const bekend = bekendeLetter();
      const wieRegel = bekend ? `<p class="midden" style="margin:18px 0 0;font-size:17px;color:var(--zacht)">Je bent <b>${esc(bekend)}</b> · <button class="link" id="nietIk">Ben je niet ${esc(bekend)}? Tik hier.</button></p>` : "";
      const koppelWie = () => { const b = $("nietIk"); if (b) b.onclick = () => { opslag.zet("opdracht-laatste-letter", null); gekozenVak = null; teken(); }; };
      if (!lijst.length) {
        gekozenVak = null; $("sub").textContent = "";
        el.innerHTML = `<div class="midden"><p class="groot">Even wachten</p><p>Er staat nu geen opdracht voor je klaar.<br>Zodra je leerkracht een opdracht klaarzet, verschijnt hij hier vanzelf.</p></div>${wieRegel}`;
        return koppelWie();
      }
      const m = mijnLetters(), klaar = opslag.lees("opdracht-klaar") || {};
      if (gekozenVak && !lijst.some(([, r]) => vakVan(r.toets) === gekozenVak)) gekozenVak = null;
      if (!gekozenVak) {
        // Eerst het vak kiezen.
        const vakken = [...vakLijst]; lijst.forEach(([, r]) => { if (!vakken.includes(vakVan(r.toets))) vakken.push(vakVan(r.toets)); });
        $("sub").textContent = "Kies eerst het vak.";
        el.innerHTML = `<div class="opdrachten">${vakken.map((v) => {
          const n = lijst.filter(([, r]) => vakVan(r.toets) === v);
          const open = n.filter(([k]) => !klaar[k]).length;
          return `<button class="opdracht${n.length ? "" : " uit"}" data-vak="${esc(v)}"${n.length ? "" : " disabled"}>
            <b>${esc(v)}</b><span class="pijl">${!n.length ? "" : open ? `${open} ${open === 1 ? "opdracht" : "opdrachten"} →` : "✓ Klaar"}</span></button>`;
        }).join("")}</div>${wieRegel}`;
        koppelWie();
        el.querySelectorAll("[data-vak]").forEach((b) => b.onclick = () => { gekozenVak = b.dataset.vak; teken(); });
        return;
      }
      $("titel").textContent = gekozenVak;
      $("sub").textContent = "Tik op de opdracht die je gaat maken.";
      el.innerHTML = `<button class="link" id="naarVakken">← Alle vakken</button><div class="opdrachten">${lijst.filter(([, r]) => vakVan(r.toets) === gekozenVak).map(([k, r]) => `
        <button class="opdracht${klaar[k] ? " gedaan" : ""}" data-k="${esc(k)}">
          <b>${esc(titelVan(r.toets))}</b>
          <span class="pijl">${klaar[k] ? "✓ Klaar" : m[k] ? "Verder →" : "→"}</span>
        </button>`).join("")}</div>`;
      $("naarVakken").onclick = () => { gekozenVak = null; teken(); };
      el.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => open(b.dataset.k));
    }

    async function open(k) {
      huidig = k; fase = "laden"; teken();
      try {
        toets = await laadJson(`opdrachten/${encodeURIComponent(rondes[k].toets)}/opdracht.json`);
        if (isWoorden()) woordenLijst = toets.woorden.map((w) => ({ plaatje: w.plaatje, woord: ontcijfer(w.a)[0] }));
      } catch { $("inhoud").innerHTML = meld("De opdracht kon niet geladen worden. Herlaad de pagina.", true); return; }
      let eerste = true;
      stopKamer = Live.luister(k, "", (w) => {
        if (huidig !== k) return;
        kamer = w || {}; leerlingen = kamer.leerlingen || {};
        if (eerste) {
          eerste = false;
          const l = mijnLetters()[k];
          if (l && leerlingen[l] && leerlingen[l].apparaat === apparaat && isWoorden()) {
            ik = l; stap = leerlingen[l].stap || 0; fouten = leerlingen[l].fouten || {};
            fase = leerlingen[l].ingeleverd ? "ingeleverd" : "woord";
          } else if (l && leerlingen[l] && leerlingen[l].apparaat === apparaat) {       // verder waar je was
            ik = l; antwoorden = toets.vragen.map((_, i) => (leerlingen[l].antwoorden || [])[i] || "");
            fase = leerlingen[l].ingeleverd ? "ingeleverd" : "vraag"; nu = 0;
          } else {
            const vorige = opslag.lees("opdracht-laatste-letter");
            if (vorige && magIk(rondes[k], vorige) && !(leerlingen[vorige] && leerlingen[vorige].ingeleverd)) { ik = vorige; fase = "bevestig"; }
            else { ik = null; fase = "letters"; }
          }
          return teken();
        }
        // De leerkracht heeft deze letter vrijgegeven.
        if (ik && fase === "ingeleverd" && !leerlingen[ik]) { ik = null; fase = "letters"; zetMijnLetter(k, null); }
        if (fase !== "vraag" && fase !== "overzicht" && fase !== "woord" && fase !== "tussen") teken();
        else if (kamer.info && kamer.info.gesloten) teken();
      });
    }

    function tekenLetters(el) {
      $("sub").textContent = voorWie(rondes[huidig]) ? "Deze opdracht is voor een paar leerlingen. Tik op jouw letter." : "Tik op jouw letter.";
      let h = terugKnop;
      const r = rondes[huidig];
      for (const g of klas.groepen) {
        const mag = g.letters.filter((l) => magIk(r, l));
        if (!mag.length) continue;
        h += `<h2>${esc(g.naam)}</h2><div class="letters">`;
        for (const l of mag) {
          const klaar = leerlingen[l] && leerlingen[l].ingeleverd;
          h += `<button class="letter" data-l="${esc(l)}"${klaar ? " disabled title=\"Al ingeleverd\"" : ""}>${esc(l)}</button>`;
        }
        h += `</div>`;
      }
      el.innerHTML = h; koppelTerug();
      el.querySelectorAll(".letter").forEach((b) => b.onclick = () => { ik = b.dataset.l; fase = "bevestig"; teken(); });
    }

    function tekenBevestig(el) {
      $("sub").textContent = "";
      const ander = leerlingen[ik] && leerlingen[ik].apparaat && leerlingen[ik].apparaat !== apparaat;
      el.innerHTML = `${terugKnop}<div class="midden"><p>Jij bent</p><p class="groot">${esc(ik)}</p><p>Klopt dat?</p></div>
        ${ander ? meld("Let op: deze letter is al gekozen op een ander apparaat. Weet je zeker dat dit jouw letter is?", true) : ""}
        <div class="rij"><button class="knop licht" id="nee">Nee, andere letter</button><button class="knop" id="ja">Ja, begin</button></div>`;
      koppelTerug();
      $("nee").onclick = () => { ik = null; fase = "letters"; teken(); };
      $("ja").onclick = async () => {
        if (isWoorden()) {
          const oud = leerlingen[ik] || {};
          stap = oud.stap || 0; fouten = oud.fouten || {}; fase = "woord";
          zetMijnLetter(huidig, ik); opslag.zet("opdracht-laatste-letter", ik);
          try { await Live.schrijf(huidig, `leerlingen/${ik}`, { apparaat, gestart: oud.gestart || Date.now(), stap }, "PATCH"); } catch {}
          return teken();
        }
        const oud = (leerlingen[ik] && leerlingen[ik].antwoorden) || [];
        antwoorden = toets.vragen.map((_, i) => oud[i] || "");
        nu = 0; fase = "vraag";
        zetMijnLetter(huidig, ik); opslag.zet("opdracht-laatste-letter", ik);
        try { await Live.schrijf(huidig, `leerlingen/${ik}`, { apparaat, gestart: Date.now(), antwoorden }, "PATCH"); } catch {}
        teken();
      };
    }

    function tekenVraag(el) {
      const v = toets.vragen[nu];
      $("sub").textContent = toets.opdracht || "";
      el.innerHTML = `
        <div class="kopregel"><span class="wie">${esc(ik)}</span><span class="teller">Vraag ${nu + 1} van ${toets.vragen.length}</span></div>
        <div class="ww">${esc(v.ww)}</div>
        <div class="zin">${esc(v.voor)} <input id="veld" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Werkwoord" value="${esc(antwoorden[nu])}"> ${esc(v.na)}</div>
        <div class="rij">
          <button class="knop licht" id="terug"${nu === 0 ? " disabled" : ""}>← Vorige</button>
          <button class="knop" id="verder">${nu === toets.vragen.length - 1 ? "Klaar" : "Volgende →"}</button>
        </div>
        <div class="bolletjes">${toets.vragen.map((_, i) => `<button class="bol${antwoorden[i].trim() ? " ingevuld" : ""}${i === nu ? " hier" : ""}" data-i="${i}">${i + 1}</button>`).join("")}</div>
        <div class="opslag" id="opslag"></div>`;
      const veld = $("veld");
      veld.oninput = () => { antwoorden[nu] = veld.value; bewaar(); el.querySelector(`.bol[data-i="${nu}"]`).classList.toggle("ingevuld", !!veld.value.trim()); };
      veld.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("verder").click(); } };
      $("terug").onclick = () => { nu--; teken(); };
      $("verder").onclick = () => { if (nu < toets.vragen.length - 1) nu++; else fase = "overzicht"; teken(); };
      el.querySelectorAll(".bol").forEach((b) => b.onclick = () => { nu = +b.dataset.i; teken(); });
      if (window.matchMedia("(pointer: fine)").matches) veld.focus();
    }

    function tekenOverzicht(el) {
      const leeg = antwoorden.filter((a) => !a.trim()).length;
      $("sub").textContent = "Kijk je antwoorden nog één keer na. Tik op een zin om hem te veranderen.";
      el.innerHTML = `
        <div class="kopregel"><span class="wie">${esc(ik)}</span><span class="teller">${toets.vragen.length - leeg} van ${toets.vragen.length} ingevuld</span></div>
        <ul class="overzicht">${toets.vragen.map((v, i) => `<li data-i="${i}"><span class="nr">${i + 1}.</span><span>${esc(v.voor)} ${antwoorden[i].trim() ? `<b>${esc(antwoorden[i].trim())}</b>` : `<span class="leeg">……</span>`} ${esc(v.na)}</span></li>`).join("")}</ul>
        ${leeg ? meld(`Je hebt nog ${leeg} ${leeg === 1 ? "zin" : "zinnen"} niet ingevuld.`, true) : ""}
        <div class="rij"><button class="knop licht" id="terug">← Terug</button><button class="knop" id="inleveren">Inleveren</button></div>
        <div class="opslag" id="opslag"></div>`;
      el.querySelectorAll(".overzicht li").forEach((li) => li.onclick = () => { nu = +li.dataset.i; fase = "vraag"; teken(); });
      $("terug").onclick = () => { nu = toets.vragen.length - 1; fase = "vraag"; teken(); };
      $("inleveren").onclick = async () => {
        const b = $("inleveren");
        if (!b.dataset.zeker) { b.dataset.zeker = "1"; b.textContent = "Zeker weten? Tik nog een keer"; return; }
        b.disabled = true; b.textContent = "Bezig…";
        try {
          clearTimeout(schrijfTimer);
          await Live.schrijf(huidig, `leerlingen/${ik}`, { apparaat, antwoorden, bijgewerkt: Date.now(), ingeleverd: Date.now() }, "PATCH");
          const klaar = opslag.lees("opdracht-klaar") || {}; klaar[huidig] = ik; opslag.zet("opdracht-klaar", klaar);
          fase = "ingeleverd"; teken();
        } catch (e) {
          b.disabled = false; b.textContent = "Inleveren"; delete b.dataset.zeker;
          el.insertAdjacentHTML("beforeend", meld("Inleveren lukte niet. Controleer de internetverbinding en probeer het opnieuw.", true));
        }
      };
    }

    // ---------- Woorden oefenen ----------
    // Elk woord komt twee keer: ronde 1 (stap 0..n-1) lezen en overtypen, ronde 2 (stap n..2n-1) uit het hoofd met plaatje en eerste letter.
    // Een fout woord probeer je opnieuw tot het goed is. Elke foute poging wordt bewaard in fouten["w<stap>"].
    const gelijk = (a, b) => String(a || "").trim().replace(/\s+/g, " ").toLowerCase() === String(b || "").trim().replace(/\s+/g, " ").toLowerCase();
    function tekenWoord(el) {
      const n = woordenLijst.length;
      if (stap >= 2 * n) { fase = "ingeleverd"; return teken(); }
      const ronde = stap < n ? 1 : 2, w = woordenLijst[stap % n];
      $("sub").textContent = ronde === 1 ? "Lees het woord en typ het over." : "Typ het woord uit je hoofd.";
      const pogingen = (fouten["w" + stap] || []).length;
      el.innerHTML = `
        <div class="kopregel"><span class="wie">${esc(ik)}</span><span class="ronde">Ronde ${ronde}</span><span class="teller">Woord ${stap % n + 1} van ${n}</span></div>
        <div class="plaatje" aria-hidden="true">${esc(w.plaatje)}</div>
        ${ronde === 1 ? `<div class="woord" id="woord">${esc(w.woord)}</div>`
          : `<div class="hint">${esc(w.woord.charAt(0))}<span class="rest">…</span></div>`}
        <input class="typ" id="typ" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Typ het woord">
        <div class="terugmelding${pogingen ? " fout" : ""}" id="terugmelding">${pogingen ? "Nog niet goed. Probeer het nog een keer." : ""}</div>
        <button class="knop breed" id="controleer">Klaar</button>
        <div class="voortgang"><div style="width:${Math.round(100 * stap / (2 * n))}%"></div></div>
        <div class="opslag" id="opslag"></div>`;
      const typ = $("typ"), woord = $("woord");
      typ.oninput = () => { if (woord) woord.classList.toggle("weg", typ.value.length > 0); typ.classList.remove("fout"); };
      typ.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); controleer(); } };
      $("controleer").onclick = controleer;
      typ.focus();
      let bezig = false;
      async function controleer() {
        if (bezig || !typ.value.trim()) return;
        bezig = true;
        if (gelijk(typ.value, w.woord)) {
          typ.classList.add("goed"); $("terugmelding").className = "terugmelding goed"; $("terugmelding").textContent = "Goed zo!";
          stap++;
          const klaar = stap >= 2 * n;
          const data = { apparaat, stap, bijgewerkt: Date.now() };
          if (klaar) data.ingeleverd = Date.now();
          try { await Live.schrijf(huidig, `leerlingen/${ik}`, data, "PATCH"); } catch { $("opslag").textContent = "Niet bewaard, geen internet?"; }
          if (klaar) { const k = opslag.lees("opdracht-klaar") || {}; k[huidig] = ik; opslag.zet("opdracht-klaar", k); }
          setTimeout(() => { fase = klaar ? "ingeleverd" : stap === n ? "tussen" : "woord"; teken(); }, 600);
        } else {
          const lijst = fouten["w" + stap] = [...(fouten["w" + stap] || []), typ.value.trim()];
          Live.schrijf(huidig, `leerlingen/${ik}/fouten/w${stap}`, lijst).catch(() => {});
          typ.value = ""; typ.classList.add("fout"); if (woord) woord.classList.remove("weg");
          $("terugmelding").className = "terugmelding fout"; $("terugmelding").textContent = "Nog niet goed. Probeer het nog een keer.";
          bezig = false; typ.focus();
        }
      }
    }
    function tekenTussen(el) {
      $("sub").textContent = "";
      el.innerHTML = `<div class="midden"><p class="groot">Ronde 1 klaar!</p>
        <p>Nu komen dezelfde woorden nog een keer. Je ziet alleen het plaatje en de eerste letter.<br>Typ het woord <b>uit je hoofd</b>.</p>
        <button class="knop breed" id="verder">Begin ronde 2</button></div>`;
      $("verder").onclick = () => { fase = "woord"; teken(); };
    }

    // Antwoorden tussendoor bewaren (de leerkracht kijkt live mee, en er gaat niets verloren).
    function bewaar() {
      clearTimeout(schrijfTimer);
      const o = $("opslag"); if (o) o.textContent = "";
      const k = huidig, l = ik;
      schrijfTimer = setTimeout(async () => {
        try {
          await Live.schrijf(k, `leerlingen/${l}`, { apparaat, antwoorden, bijgewerkt: Date.now() }, "PATCH");
          const o2 = $("opslag"); if (o2) o2.textContent = "✓ Bewaard";
        } catch { const o2 = $("opslag"); if (o2) o2.textContent = "Niet bewaard, geen internet?"; }
      }, 700);
    }

    async function begin() {
      if (!Live.beschikbaar()) { teken(); return; }
      try { [overzicht, klas] = await Promise.all([laadJson("opdrachten/overzicht.json").then((o) => { vakLijst = o.vakken || []; return o.opdrachten || []; }), laadJson("opdrachten/klas.json")]); }
      catch { $("inhoud").innerHTML = meld("De opdrachten konden niet geladen worden. Herlaad de pagina.", true); return; }
      Live.luister(PLEK, "actief", (a) => {
        // Ook het oude formaat (één opdracht) begrijpen.
        rondes = !a ? {} : typeof a.kamer === "string" ? { [a.kamer]: { toets: a.toets, gestart: a.gestart } } : a;
        if (!huidig || fase === "lijst" || fase === "letters" || fase === "bevestig" || fase === "ingeleverd" || !rondes[huidig]) teken();
      });
    }
    begin();
  })();
  </script>
</body>
</html>
